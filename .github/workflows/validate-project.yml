# Reusable check for project repositories: validates the calling repository's
# docs/site/ against this site's schema, warns about download entries the
# latest release does not have, and checks that assets/brand/ (the app icons
# made from the pixel monogram) matches project.yml, and that the app theme
# (scripts/theme.ts), where the project names its folder, is current. In a
# project repository:
#
#   jobs:
#     site-data:
#       uses: amigo-labs/website/.github/workflows/validate-project.yml@main
#       with:
#         theme-dir: ui/src/theme        # optional: tokens.css, components.css
#         theme-rust: crates/app/src/theme.rs   # optional: the Rust constants
#
# (trigger it on pull requests that touch docs/site/** or the theme files).
name: validate-project

on:
  workflow_call:
    inputs:
      theme-dir:
        description: Folder of the generated app theme (tokens.css, components.css, theme.json), relative to the repository root.
        type: string
        default: ''
      theme-rust:
        description: Path of the generated Rust theme module, relative to the repository root.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: amigo-labs/website
          path: website
      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: node scripts/fetch-data.ts --local .. --only "${{ github.repository }}"
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # App icons made from the monogram must match project.yml (accent, monogram).
      - name: Check assets/brand/ against the monogram
        working-directory: website
        run: |
          brand="../${{ github.event.repository.name }}/assets/brand"
          if [ -f "$brand/monogram.json" ]; then
            node scripts/monogram.ts "../${{ github.event.repository.name }}/docs/site/project.yml" --out "$brand" --check
          else
            echo "no assets/brand/monogram.json — skipped"
          fi
      # The app theme must match theme/ here and the accent in project.yml.
      - name: Check the app theme
        if: inputs.theme-dir != '' || inputs.theme-rust != ''
        working-directory: website
        env:
          REPO: ../${{ github.event.repository.name }}
          THEME_DIR: ${{ inputs.theme-dir }}
          THEME_RUST: ${{ inputs.theme-rust }}
        run: |
          set -- "$REPO/docs/site/project.yml" --check
          if [ -n "$THEME_DIR" ]; then set -- "$@" --out "$REPO/$THEME_DIR"; fi
          if [ -n "$THEME_RUST" ]; then set -- "$@" --rust "$REPO/$THEME_RUST"; fi
          node scripts/theme.ts "$@"
