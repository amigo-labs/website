# Reusable check for project repositories: validates the calling repository's
# docs/site/ against this site's schema, warns about download entries the
# latest release does not have, and checks that assets/brand/ (the app icons
# made from the pixel monogram) matches project.yml. In a project repository:
#
#   jobs:
#     site-data:
#       uses: amigo-labs/website/.github/workflows/validate-project.yml@main
#
# (trigger it on pull requests that touch docs/site/**).
name: validate-project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: amigo-labs/website
          path: website
      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: node scripts/fetch-data.ts --local .. --only "${{ github.repository }}"
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # App icons made from the monogram must match project.yml (accent, monogram).
      - name: Check assets/brand/ against the monogram
        working-directory: website
        run: |
          brand="../${{ github.event.repository.name }}/assets/brand"
          if [ -f "$brand/monogram.json" ]; then
            node scripts/monogram.ts "../${{ github.event.repository.name }}/docs/site/project.yml" --out "$brand" --check
          else
            echo "no assets/brand/monogram.json — skipped"
          fi
