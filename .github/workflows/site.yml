name: site

# Pushes to main are deployed by Cloudflare Workers Builds (wrangler.toml).
# This workflow checks pull requests and pushes, and redeploys when a
# project changed without a push here: every hour and on a
# `project-updated` dispatch (docs/project-data.md, "Faster updates").
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [project-updated]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Strict on main: a project that loses its docs/site/project.yml fails
      # instead of silently disappearing. Pull requests only warn, so a
      # project can be added here before its data is merged.
      - name: Fetch project data
        run: node scripts/fetch-data.ts ${{ github.event_name != 'pull_request' && '--strict' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm exec astro check
      - run: pnpm exec astro build

  redeploy:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the scheduled redeploy (README, \"Deployment\")."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile && pnpm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
