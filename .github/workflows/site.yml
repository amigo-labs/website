name: site

# Cloudflare Workers Builds builds and deploys every push to main
# (wrangler.toml); no Cloudflare credentials live here. This workflow checks
# pull requests and pushes, and every 15 minutes looks for project changes:
# it fetches the project data and commits data.lock.json when it changed, so
# the change reaches Cloudflare as a push (docs/project-data.md, "Updates").
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Strict on main: a project that loses its docs/site/project.yml fails
      # instead of silently disappearing. Pull requests only warn, so a
      # project can be added here before its data is merged.
      - name: Fetch project data
        run: node scripts/fetch-data.ts ${{ github.event_name != 'pull_request' && '--strict' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm exec astro check
      - run: pnpm exec astro build

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch project data
        run: node scripts/fetch-data.ts --strict --lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A push with the workflow token starts no other workflow, but
      # Cloudflare's Git integration builds it like any push to main.
      - name: Commit data.lock.json
        run: |
          if [ ! -f .data/lock-message.txt ]; then
            echo "No project changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.lock.json
          git commit -q -F .data/lock-message.txt
          git push origin HEAD:main || { git pull -q --rebase origin main && git push origin HEAD:main; }
