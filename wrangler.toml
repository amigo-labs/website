# amigo-labs.dev — static assets only, no Worker code.
#
# Cloudflare Workers Builds (Worker "website", connected to this repository)
# runs the build command `pnpm run build` and then `npx wrangler deploy` on
# main or `npx wrangler preview` on other branches. The build reads each
# project's docs/site/ and its GitHub releases (scripts/fetch-data.ts);
# .github/workflows/site.yml commits data.lock.json when a project changed,
# and that push starts the build.
# Optional build variable GITHUB_TOKEN (read-only) avoids GitHub's anonymous
# rate limit on the shared build machines.
name = "website"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "amigo-labs.dev", custom_domain = true },
]

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Branch builds run `wrangler preview` (Worker Previews), which requires this
# block. Empty: a static site has no preview-specific bindings.
[previews]
